# ======================================================================
# frpc 客户端配置 - 内网服务器 192.168.3.52（INI 格式，frp v0.70.0）
# ----------------------------------------------------------------------
# 变更说明（相对原配置）：
#   1) shijia-admin: remote_port 18080 → 80（公网 80 直接到内网 admin）
#   2) shijia-api:   local_port 3000 → 443, remote_port 13000 → 443
#                    （SSL 卸载迁到内网 nginx，公网 443 直接到内网 443）
#   3) 其余 iotweb 代理保持不变
# ======================================================================

[common]
server_addr = 8.163.118.2
server_port = 7000
token = q1w2e3r4t5y6
login_fail_exit = false

# 拾家有方管理端：内网 Nginx 80 → 公网 80
# 访问方式：http://8.163.118.2/ （公网 IP 直连 admin）
[shijia-admin]
type = tcp
local_ip = 127.0.0.1
local_port = 80
remote_port = 80

# 拾家有方后端 API：内网 Nginx 443(SSL) → 公网 443
# 访问方式：https://sjyf.solo1157.xyz/api/* （微信小程序）
[shijia-api]
type = tcp
local_ip = 127.0.0.1
local_port = 443
remote_port = 443

# 拾家有方小程序端 H5：内网 Nginx 8081 → 公网 8081（调试用）
[shijia-h5]
type = tcp
local_ip = 127.0.0.1
local_port = 8081
remote_port = 8081

# 长沙众电服务
