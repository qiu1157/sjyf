# ======================================================================
# 拾家有方 - 用户端 H5 站点 Nginx 配置（宝塔面板版 · 统一部署根目录 /www/wwwroot/shijia/）
# ----------------------------------------------------------------------
# 宝塔操作步骤：
#   1. 新建站点 m.shijia.com，根目录选：
#          /www/wwwroot/shijia/sites/h5/dist/build/h5
#      （对应 miniapp-h5.zip 解包后的 dist/build/h5/）
#   2. 站点设置 → 配置文件 → 覆盖粘贴本文件
#   3. 启用 SSL（证书必须与域名匹配；H5 微信跳转必须 HTTPS）
# ======================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name m.shijia.com;  # TODO: 改为真实用户端 H5 域名

    # ssl_certificate     /www/server/panel/vhost/cert/m.shijia.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/m.shijia.com/privkey.pem;

    # 日志（统一到 /www/wwwlog/shijia/；宝塔默认是 /www/wwwlogs，如沿用改路径即可）
    access_log  /www/wwwlog/shijia/h5-access.log;
    error_log   /www/wwwlog/shijia/h5-error.log;

    # 限制：H5 一般只上传头像，仍保留 20m 避免小程序转 H5 时上传订单照片被拒
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # -----------------------------------------------------------------
    # A) /api/ 反向代理 → Node 后端（与 Admin 完全相同，末尾 / 必须成对）
    # -----------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # -----------------------------------------------------------------
    # B) 上传图（同 Admin，避免 H5 页内 <img src="/uploads/xxx"> 引用返回 404）
    # -----------------------------------------------------------------
    location /uploads/ {
        alias  /www/wwwroot/shijia/data/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------
    # C) uni-app H5 产物静态资源（/static 与构建后的 chunk）
    # -----------------------------------------------------------------
    location /static/ {
        alias  /www/wwwroot/shijia/sites/h5/dist/build/h5/static/;
        expires 7d;
        add_header Cache-Control "public, immutable, max-age=604800";
        try_files $uri =404;
    }
    location ~ \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        root /www/wwwroot/shijia/sites/h5/dist/build/h5;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------
    # D) uni-app H5 history 模式兜底
    # -----------------------------------------------------------------
    location / {
        root  /www/wwwroot/shijia/sites/h5/dist/build/h5;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
