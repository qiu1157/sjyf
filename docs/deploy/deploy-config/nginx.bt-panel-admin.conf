# ======================================================================
# 拾家有方 - 管理后台 Admin 站点 Nginx 配置（宝塔面板版 · 内网 192.168.3.52）
# ----------------------------------------------------------------------
# 访问方式：http://8.163.118.2/ （公网 IP 直连，frp 透传 80 端口）
# 本站点为 default_server，所有未匹配域名的请求（含 IP 访问）都命中这里
# ======================================================================

server {
    listen 80 default_server;
    server_name _;

    # 日志
    access_log  /www/wwwlog/shijia/admin-access.log;
    error_log   /www/wwwlog/shijia/admin-error.log;

    # 上传大小限制（家政订单多张现场图）
    client_max_body_size 20m;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # -----------------------------------------------------------------
    # A) 后端 API 反向代理 → 127.0.0.1:3000
    # -----------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # -----------------------------------------------------------------
    # B) 上传的现场图 / 头像 / 物料图
    # -----------------------------------------------------------------
    location /uploads/ {
        alias  /www/wwwroot/shijia/data/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # -----------------------------------------------------------------
    # C) 打包产物 assets 缓存
    # -----------------------------------------------------------------
    location /assets/ {
        alias  /www/wwwroot/shijia/sites/admin/dist/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable, max-age=604800";
    }

    # -----------------------------------------------------------------
    # D) React SPA 兜底
    # -----------------------------------------------------------------
    location / {
        root  /www/wwwroot/shijia/sites/admin/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
