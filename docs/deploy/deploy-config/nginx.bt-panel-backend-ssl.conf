# ======================================================================
# 拾家有方 - 后端 API HTTPS 站点（宝塔面板版 · 内网 192.168.3.52）
# ----------------------------------------------------------------------
# 域名：sjyf.solo1157.xyz
# 作用：SSL 卸载 + 反向代理到 backend:3000
# 流量：https://sjyf.solo1157.xyz/api/* → 127.0.0.1:3000
#
# 部署方式（二选一）：
#   方式A（推荐，长期）：宝塔面板添加站点 sjyf.solo1157.xyz → SSL → Let's Encrypt 申请
#   方式B（快速迁移）：从 8.163.118.2 拷贝现有证书到本机，手动配置
# ======================================================================

# ----------------------------------------------------------------------
# 80 端口：处理 Let's Encrypt HTTP-01 验证 + 其余跳转 HTTPS
# ----------------------------------------------------------------------
server {
    listen 80;
    server_name sjyf.solo1157.xyz;

    # Let's Encrypt 验证文件目录（宝塔默认放在站点根目录）
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/shijia/sites/api;
    }

    # 其余所有请求 301 跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------
# 443 端口：SSL 卸载 + 反向代理到 backend:3000
# ----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name sjyf.solo1157.xyz;

    # ---- SSL 证书 ----
    # 方式A（宝塔 Let's Encrypt）：宝塔会自动写入以下两行，不要删除
    # ssl_certificate     /www/server/panel/vhost/cert/sjyf.solo1157.xyz/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/sjyf.solo1157.xyz/privkey.pem;

    # 方式B（手动拷贝证书）：取消下面两行注释，路径指向拷贝过来的证书
    # ssl_certificate     /www/wwwroot/shijia/secrets/sjyf.solo1157.xyz/fullchain.pem;
    # ssl_certificate_key /www/wwwroot/shijia/secrets/sjyf.solo1157.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log  /www/wwwlogs/shijia/backend-access.log;
    error_log   /www/wwwlogs/shijia/backend-error.log;

    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # 整个域名反代到 backend（backend 路由前缀为 /api）
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
